limit_req_zone $binary_remote_addr zone=century_contact:10m rate=5r/m;

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location ~* \.(?:mp4|webm|jpg|jpeg|png|webp|svg|avif|woff2?|ttf)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header Accept-Ranges bytes;
    try_files $uri =404;
  }

  location = /api/contact {
    limit_req zone=century_contact burst=5 nodelay;
    limit_except POST { deny all; }
    client_max_body_size 16k;

    proxy_pass http://bot-sender:3001/send;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
